<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · MotionStudio by MagicBolt.ai</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231354BC'/%3E%3Cpath d='M36 6 14 36h14l-4 22 22-30H32z' fill='%23FDC60B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>try { if (localStorage.getItem("studio-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
  <main class="lg-wrap">
    <section class="lg-card" aria-labelledby="lg-title">
      <div class="lg-brand">
        <span class="lg-bolt"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M36 6 14 36h14l-4 22 22-30H32z" /></svg></span>
        <div><h1 id="lg-title">MotionStudio</h1><p>by MagicBolt.ai</p></div>
      </div>
      <form id="lg-form" autocomplete="on" novalidate>
        <label class="lg-f"><span>Username</span><input id="lg-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus /></label>
        <label class="lg-f"><span>Password</span>
          <span class="lg-pw"><input id="lg-pass" name="password" type="password" autocomplete="current-password" required />
            <button type="button" id="lg-eye" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
        </label>
        <div id="lg-err" class="lg-err" role="alert" hidden></div>
        <button type="submit" id="lg-go" class="lg-go">Sign in</button>
      </form>
      <p class="lg-foot">Access is limited to MagicBolt.ai admins.</p>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
